<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streetmon Models</title>
    <style>
      :root { --bg: #15171c; --panel: #1f2229; --text: #e8e8ea; --muted: #9aa0aa; --line: #2e323b; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; }
      .panel { position: fixed; top: 12px; left: 12px; width: min(320px, calc(100vw - 24px)); background: rgba(31, 34, 41, 0.92); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
      .panel h1 { font-size: 15px; margin: 0; }
      label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
      select, button { font: inherit; color: var(--text); background: #2a2e37; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; color: #111; }
      .stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .desc { font-size: 12px; color: var(--muted); }
      .err { color: #ff8080; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div class="panel">
      <h1>Streetmon models</h1>
      <label>Creature <select id="creature"></select></label>
      <label>Clip <select id="clip"></select></label>
      <div class="row">
        <label class="row" style="color: var(--text)"><input type="checkbox" id="shiny" /> Shiny</label>
        <label class="row" style="color: var(--text)"><input type="checkbox" id="spin" checked /> Turntable</label>
        <label class="row" style="color: var(--text)"><input type="checkbox" id="lineup" /> Line-up</label>
        <label class="row" style="color: var(--text)" title="Build from the code instead of loading the exported .glb"><input type="checkbox" id="live" /> Live build</label>
      </div>
      <div id="types" class="row"></div>
      <div id="stats" class="stats"></div>
      <div id="desc" class="desc"></div>
    </div>
    <script type="module" src="/src/preview/preview.ts"></script>
  </body>
</html>
